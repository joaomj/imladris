[project]
name = "x-digest"
version = "0.1.0"
description = "Local, private, append-only X bookmark archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.7.0",
    "pydantic-settings>=2.14.2",
    "xdk>=0.10.0",
]

[project.scripts]
x-digest = "x_digest.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "ERA", "PL", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
